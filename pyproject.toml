[project]
name = "modded-nanogpt"
version = "0.1.0"
description = "A modded NanoGPT training script"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=2.1.3",
    "torch>=2.7.0",
    "huggingface-hub>=0.26.2",
    "tqdm>=4.67.0",
    "pip>=24.3.1",
]

[tool.ruff]
line-length = 120

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "ipython>=8.32.0",
    "lovely-tensors>=0.1.18",
    "pandas>=2.2.3",
    "py-spy>=0.4.0",
]
